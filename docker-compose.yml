services:
  controlcenter:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "5566:5566"
    environment:
      # ssh resolves ~ from passwd (root in-container) — pass the key explicitly.
      # Node bootstrap/repair only (ADR-0002); runtime ops ride the agent channel.
      CC_SSH_IDENTITY: /home/${CC_USER:-piresbruno}/.ssh/id_ed25519
    volumes:
      # ADR-0003: file-backed SQLite + JSON config survive rebuilds here
      - ./config:/app/config
      # ADR-0009: the dashboard is filesystem-independent — no store or
      # modelctl mounts. The NAS share is mounted on the NODES; the store
      # catalog dispatches to a node via the agent job channel.
      - ${CC_HOME:-${HOME}}/.ssh:/home/${CC_USER:-piresbruno}/.ssh:ro
    restart: unless-stopped
    # Host networking is the alternative when the gateway must reach
    # loopback-bound engines on this same machine:
    # network_mode: host
